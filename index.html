<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:site_name" content="Aetheris">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Aetheris">
    <meta property="og:description" content="Web Audio APIを利用した、ブラウザだけで動作する環境音ジェネレーターです。">
    <meta property="og:url" content="https://malken21.github.io/Aetheris/">
    <meta property="og:image" content="https://malken21.github.io/Aetheris/screenshot.png">
    <meta name="twitter:card" content="summary_large_image">
    <title>Aetheris</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="app-container">
        <header>
            <h1>Aetheris</h1>
            <p class="subtitle">環境音を生成します。</p>
        </header>

        <main>
            <section class="master-controls">
                <button id="play-pause-btn" class="glow-button">
                    <span class="icon">▶</span> 再生開始
                </button>
            </section>

            <div class="layers-grid">
                <!-- 雨レイヤー -->
                <div class="sound-card" data-layer="rain"
                    style="border-color: var(--primary-accent); box-shadow: rgba(100, 255, 218, 0.1) 0px 0px 20px;">
                    <div class="card-header">
                        <div class="icon-wrapper">🌧️</div>
                        <h2>雨</h2>
                        <label class="switch">
                            <input type="checkbox" id="rain-toggle" checked>
                            <span class="slider round"></span>
                        </label>
                    </div>
                    <div class="controls">
                        <div class="control-group">
                            <label for="rain-vol">強度</label>
                            <input type="range" id="rain-vol" min="0" max="1" step="0.01" value="0.5">
                        </div>
                    </div>
                </div>

                <!-- 風レイヤー -->
                <div class="sound-card" data-layer="wind"
                    style="border-color: var(--primary-accent); box-shadow: rgba(100, 255, 218, 0.1) 0px 0px 20px;">
                    <div class="card-header">
                        <div class="icon-wrapper">💨</div>
                        <h2>風</h2>
                        <label class="switch">
                            <input type="checkbox" id="wind-toggle" checked>
                            <span class="slider round"></span>
                        </label>
                    </div>
                    <div class="controls">
                        <div class="control-group">
                            <label for="wind-vol">強度</label>
                            <input type="range" id="wind-vol" min="0" max="1" step="0.01" value="0.4">
                        </div>
                    </div>
                </div>

                <!-- 焚き火レイヤー -->
                <div class="sound-card" data-layer="fire"
                    style="border-color: var(--primary-accent); box-shadow: rgba(100, 255, 218, 0.1) 0px 0px 20px;">
                    <div class="card-header">
                        <div class="icon-wrapper">🔥</div>
                        <h2>焚き火</h2>
                        <label class="switch">
                            <input type="checkbox" id="fire-toggle" checked>
                            <span class="slider round"></span>
                        </label>
                    </div>
                    <div class="controls">
                        <div class="control-group">
                            <label for="fire-vol">強度</label>
                            <input type="range" id="fire-vol" min="0" max="1" step="0.01" value="0.3">
                        </div>
                    </div>
                </div>

                <!-- 深層流（ブラウンノイズ）レイヤー -->
                <div class="sound-card" data-layer="brown"
                    style="border-color: var(--primary-accent); box-shadow: rgba(100, 255, 218, 0.1) 0px 0px 20px;">
                    <div class="card-header">
                        <div class="icon-wrapper">🌊</div>
                        <h2>深層流</h2>
                        <label class="switch">
                            <input type="checkbox" id="brown-toggle" checked>
                            <span class="slider round"></span>
                        </label>
                    </div>
                    <div class="controls">
                        <div class="control-group">
                            <label for="brown-vol">強度</label>
                            <input type="range" id="brown-vol" min="0" max="1" step="0.01" value="0.6">
                        </div>
                    </div>
                </div>
            </div>

            <section class="automation-panel glass-panel">
                <h3><span class="indicator">●</span> 自動変調</h3>
                <p>環境音を自律的に変化させます。</p>
                <label class="switch">
                    <input type="checkbox" id="auto-modulate-toggle" checked>
                    <span class="slider round"></span>
                </label>
            </section>
        </main>

        <footer>
            <p>&copy; 2026 Aetheris System. Audio generated locally.</p>
        </footer>
    </div>

    <script type="module" src="js/app.js"></script>
</body>

</html>
